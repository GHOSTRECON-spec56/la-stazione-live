[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  GIT_LFS_ENABLED = "true"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send visitors with cached Netlify DNS to the active owner workspace.
[[redirects]]
  from = "/owner"
  to = "https://la-stazione.la-stazione-site.workers.dev/owner/"
  status = 302
  force = true

[[redirects]]
  from = "/owner/*"
  to = "https://la-stazione.la-stazione-site.workers.dev/owner/:splat"
  status = 302
  force = true

[[headers]]
  for = "/owner/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' https: data: blob:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

